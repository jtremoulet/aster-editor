# nginx.conf — démo Aster Editor
# Prévu pour tourner derrière un reverse proxy : TLS géré en amont, ici HTTP simple.

# Fichiers hashés par le build Angular (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css) :
# cache long. Tout le reste (index.html, échantillons .docx) est revalidé à chaque requête,
# pour qu'un déploiement soit visible tout de suite.
map $uri $cache_control {
    default                                     "no-cache";
    # Entre guillemets : sans eux, nginx lit l'accolade du quantificateur comme un bloc.
    "~^/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css)$"    "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Banc d'essai, pas une vitrine : jamais indexé.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Pas de location dédiée au cache : un add_header dans une location effacerait
    # tous les en-têtes ci-dessus.
    add_header Cache-Control $cache_control always;

    # Un fichier absent reste un 404 : après un déploiement, un onglet resté ouvert qui
    # demande un ancien chunk ne doit pas recevoir index.html à la place du JavaScript.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # SPA : une route Angular (/form, /import…) rechargée retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
